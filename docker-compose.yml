services:
  mysql:
    image: mysql:8.4
    container_name: iam-mysql
    environment:
      MYSQL_DATABASE: iamdb
      MYSQL_USER: iam
      MYSQL_PASSWORD: iam
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - iam-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "iam", "-piam"]
      interval: 5s
      timeout: 5s
      retries: 10

  iam-service:
    build: .
    container_name: iam-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/iamdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: iam
      DB_PASSWORD: iam
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-which-should-be-at-least-256-bits-long-for-hs256}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"

volumes:
  iam-mysql-data:
